services:
  postgres:
    image: postgres:15-alpine
    container_name: poketactix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poketactix-network

  redis:
    image: redis:7-alpine
    container_name: poketactix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - poketactix-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: poketactix-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      POKEMON_CACHE_TTL: ${POKEMON_CACHE_TTL:-720h}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      PORT: ${PORT}
      ENV: ${ENV}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW}
      POKEAPI_BASE_URL: ${POKEAPI_BASE_URL}
      POKEAPI_TIMEOUT: ${POKEAPI_TIMEOUT}
      # Token System Configuration
      TOKEN_RESET_TIME: ${TOKEN_RESET_TIME}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT}
      TOKEN_PRICE: ${TOKEN_PRICE}
      DAILY_PURCHASE_LIMIT: ${DAILY_PURCHASE_LIMIT}
      TOKEN_COST_1V1: ${TOKEN_COST_1V1}
      TOKEN_COST_5V5: ${TOKEN_COST_5V5}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/vendor
      - /app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh /app/scripts/start-backend.sh
    networks:
      - poketactix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: poketactix-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - poketactix-network

volumes:
  postgres_data:
  redis_data:

networks:
  poketactix-network:
    driver: bridge
