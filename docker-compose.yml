services:
  postgres:
    image: postgres:15-alpine
    container_name: poketactix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poketactix-network

  redis:
    image: redis:7-alpine
    container_name: poketactix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - poketactix-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: poketactix-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${BACKEND_REDIS_URL:-redis://redis:6379/0}
      POKEMON_CACHE_TTL: ${POKEMON_CACHE_TTL:-720h}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      PORT: ${PORT}
      ENV: ${ENV}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW}
      POKEAPI_BASE_URL: ${POKEAPI_BASE_URL}
      POKEAPI_TIMEOUT: ${POKEAPI_TIMEOUT}
      # Token System Configuration
      TOKEN_RESET_TIME: ${TOKEN_RESET_TIME}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT}
      TOKEN_PRICE: ${TOKEN_PRICE}
      DAILY_PURCHASE_LIMIT: ${DAILY_PURCHASE_LIMIT}
      TOKEN_COST_1V1: ${TOKEN_COST_1V1}
      TOKEN_COST_5V5: ${TOKEN_COST_5V5}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh /app/scripts/start-backend.sh
    networks:
      - poketactix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: poketactix-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - poketactix-network

  # ─── Monitoring Stack ────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: poketactix-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - poketactix-network

  loki-init:
    image: busybox:1.36
    container_name: poketactix-loki-init
    user: root
    volumes:
      - loki_data:/loki
    command: ["chown", "-R", "10001:10001", "/loki"]

  loki:
    image: grafana/loki:latest
    container_name: poketactix-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    depends_on:
      loki-init:
        condition: service_completed_successfully
    networks:
      - poketactix-network

  promtail:
    image: grafana/promtail:latest
    container_name: poketactix-promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - poketactix-network

  grafana:
    image: grafana/grafana:latest
    container_name: poketactix-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: poketactix
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    networks:
      - poketactix-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  poketactix-network:
    driver: bridge
